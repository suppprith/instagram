org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version. CI release builds override with -Pdms.versionName=<tag without v>.
dms.versionName=1.0.0

# Where the app looks for the remote rules patch and for new releases.
# Both are plain static files; a failed fetch is ignored.
dms.patchUrl=https://raw.githubusercontent.com/suppprith/instagram/master/patch/rules-patch.json
dms.releasesRepo=suppprith/instagram
