name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret. See README, Releasing." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        env:
          DMS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DMS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DMS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DMS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testReleaseUnitTest assembleRelease -Pdms.versionName=${{ steps.version.outputs.name }}

      - name: Name and checksum
        id: apk
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "No signed APK at $src (signing config missing?)" >&2
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          out="instagram-dms-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
